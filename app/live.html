<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live computer status</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#1c2330;--mut:#667085;--grid:#e4e7ec;
        --cpu:#2563eb;--ram:#9333ea;--gpu:#16a34a;--temp:#ea580c;--pow:#dc2626;--net:#0891b2}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--fg:#e6e9ef;--mut:#8b93a3;--grid:#2a303c}}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
  h1{font-size:18px;margin:0 0 4px} .sub{color:var(--mut);margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
  .card{background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:0 1px 2px #0002}
  .card h2{font-size:13px;margin:0;color:var(--mut);font-weight:600;display:flex;justify-content:space-between}
  .big{font-size:28px;font-weight:700;margin:2px 0}
  .stats{color:var(--mut);font-size:12px;line-height:1.5;margin-top:6px}
  canvas{width:100%;height:120px;display:block}
  .warn{color:var(--pow)}
  .layout main{min-width:0}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;align-items:start}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  #settings label{display:block;margin:8px 0 2px;color:var(--mut);font-size:12px}
  #settings input{width:100%;box-sizing:border-box;padding:6px;border:1px solid var(--grid);border-radius:6px;background:var(--bg);color:var(--fg)}
  #settings button{margin-top:12px;padding:7px 14px;border:0;border-radius:6px;background:var(--cpu);color:#fff;cursor:pointer}
  #settings h3{font-size:12px;margin:14px 0 0;color:var(--mut);text-transform:uppercase}
  #msg{margin-left:8px;font-size:12px}
</style>
<header class="card topbar">
  <div class="tb-id"><h1 id="host">Live computer status</h1><div class="sub" id="sub">connecting...</div></div>
  <div class="tb-svc"><i class="led" id="led-app"></i><div><b>Dashboard</b><small>:8765</small></div></div>
  <div class="tb-svc"><i class="led" id="led-br"></i><div><b>Browser service</b><small id="br-info"></small></div></div>
  <div class="tb-act"><button id="br-toggle" disabled>Headless: ?</button><small id="br-msg"></small></div>
</header>
<style>
.topbar{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.topbar .sub{margin:0}.tb-id{flex:1 1 220px}
.tb-svc{display:flex;align-items:center;gap:4px}.tb-svc b{display:block;font-size:13px}.tb-svc small{color:var(--mut);font-size:12px}
.tb-act{display:flex;align-items:center;gap:8px}
.tb-act button{padding:7px 14px;border:0;border-radius:6px;background:var(--cpu);color:#fff;cursor:pointer}
.tb-act button:disabled{opacity:.5;cursor:default}.tb-act small{color:var(--mut)}
.led{flex:none;display:inline-block;width:12px;height:12px;border-radius:50%;background:#888;margin-right:6px}
.led.on{background:#2ecc71;box-shadow:0 0 6px #2ecc71}.led.off{background:#e74c3c;box-shadow:0 0 6px #e74c3c}
</style>
<div class="layout">
<main><div class="grid" id="g"></div></main>
<aside class="card" id="settings">
  <h2><span>Settings</span><span class="stats" style="margin:0" id="sfile"></span></h2>
  <label>Sample interval to SQLite (seconds)</label><input id="s-interval" type="number" min="1" max="3600">
  <label>Retention (days)</label><input id="s-retention" type="number" min="1" max="3650">
  <h3>Graph window</h3>
  <label>Show last <b id="w-lbl"></b></label><input id="w-range" type="range" min="0" max="100" value="0">
  <div class="stats" id="w-info"></div>
  <h3>Power model (estimate)</h3>
  <label>CPU idle (W)</label><input id="s-idle" type="number" min="0">
  <label>CPU full load (W)</label><input id="s-max" type="number" min="0">
  <label>Other components (W)</label><input id="s-other" type="number" min="0">
  <button id="s-save">Save</button><span id="msg"></span>
  <h3>Pages</h3>
  <div class="stats"><a href="/api/samples?hours=24" style="color:var(--cpu)">Saved samples (JSON)</a> · <a href="/status" style="color:var(--cpu)">WSL / system snapshot</a></div>
  <h3>Database</h3>
  <div class="stats" id="dbstats"></div>
</aside>
</div>
<script>
async function loadSettings(fillInputs){
  const d=await (await fetch('/api/settings')).json(),s=d.settings,b=d.db;
  if(fillInputs){
    document.getElementById('s-interval').value=s.sample_interval_s;
    document.getElementById('s-retention').value=s.retention_days;
    document.getElementById('s-idle').value=s.power_model.cpu_idle_w;
    document.getElementById('s-max').value=s.power_model.cpu_max_w;
    document.getElementById('s-other').value=s.power_model.other_w;
    document.getElementById('sfile').textContent=d.file;
  }
  if(b.first_ts){SPAN=Math.max(120,Date.now()/1000-b.first_ts);wLabel()}
  const last=b.last_ts?new Date(b.last_ts*1000).toLocaleTimeString():'-';
  document.getElementById('dbstats').innerHTML=`${b.rows} rows · ${b.db_size_kb} KB<br>last saved ${last}<br>${b.db_path}`;
}
document.getElementById('s-save').onclick=async()=>{
  const v=id=>Number(document.getElementById(id).value),m=document.getElementById('msg');
  const r=await fetch('/api/settings',{method:'POST',body:JSON.stringify({sample_interval_s:v('s-interval'),retention_days:v('s-retention'),
    power_model:{cpu_idle_w:v('s-idle'),cpu_max_w:v('s-max'),other_w:v('s-other')}})});
  const j=await r.json();m.textContent=r.ok?'saved':j.error;m.className=r.ok?'':'warn';
  if(r.ok)loadSettings(true);
};
loadSettings(true);setInterval(()=>loadSettings(false),5000);</script>
<script>
const CARDS=[
 {id:'cpu',title:'CPU',color:'--cpu',max:100,val:s=>s.cpu.util_percent,fmt:v=>v.toFixed(0)+'%',
  extra:s=>`${s.cpu.name}<br>Speed ${s.cpu.speed_ghz} GHz · ${s.cpu.processes} processes · ${s.cpu.threads} threads<br>`+
           `Temp ${s.cpu.temp_c==null?'n/a (needs LibreHardwareMonitor)':s.cpu.temp_c.toFixed(0)+' °C'}`},
 {id:'ram',title:'Memory',color:'--ram',max:100,val:s=>s.memory.percent,fmt:v=>v.toFixed(0)+'%',
  extra:s=>`In use ${(s.memory.used_mb/1024).toFixed(1)} / ${(s.memory.total_mb/1024).toFixed(1)} GB<br>Committed ${(s.memory.committed_mb/1024).toFixed(1)} GB · Cached ${(s.memory.cached_mb/1024).toFixed(1)} GB`},
 {id:'gpu',title:'GPU',color:'--gpu',max:100,val:s=>s.gpu?s.gpu.util_percent:null,fmt:v=>v.toFixed(0)+'%',
  extra:s=>s.gpu?`${s.gpu.name}<br>VRAM ${(s.gpu.vram_used_mb/1024).toFixed(1)} / ${(s.gpu.vram_total_mb/1024).toFixed(1)} GB · ${s.gpu.clock_mhz} MHz<br>Temp ${s.gpu.temp_c} °C · Power ${s.gpu.power_w} W · Fan ${s.gpu.fan_percent}%`:'no NVIDIA GPU'},
 {id:'gtemp',title:'GPU temperature',color:'--temp',max:100,val:s=>s.gpu?s.gpu.temp_c:null,fmt:v=>v.toFixed(0)+' °C',extra:()=>''},
 {id:'ctemp',title:'CPU temperature',color:'--temp',max:100,val:s=>s.cpu.temp_c,fmt:v=>v.toFixed(0)+' °C',
  extra:s=>s.cpu.temp_c==null?'Windows exposes no CPU sensor without a driver. Run LibreHardwareMonitor (admin) with Options → Remote Web Server (port 8085) and it shows up here.':''},
 {id:'pow',title:'Power (estimate)',color:'--pow',max:null,val:s=>s.power.total_w_est,fmt:v=>v.toFixed(0)+' W',
  extra:s=>`CPU ~${s.power.cpu_w_est} W (model) · GPU ${s.power.gpu_w} W (measured) · rest ~${s.power.other_w_est} W (flat)`},
 {id:'disk',title:'Disk',color:'--net',max:100,val:s=>s.disk.active_percent,fmt:v=>v.toFixed(0)+'%',
  extra:s=>`Read ${s.disk.read_mbps} MB/s · Write ${s.disk.write_mbps} MB/s`},
 {id:'net',title:'Network',color:'--net',max:null,val:s=>s.network.recv_mbps+s.network.sent_mbps,fmt:v=>v.toFixed(1)+' Mbps',
  extra:s=>`Down ${s.network.recv_mbps} Mbps · Up ${s.network.sent_mbps} Mbps`},
];
const g=document.getElementById('g');
for(const c of CARDS){g.insertAdjacentHTML('beforeend',`<div class="card"><h2><span>${c.title}</span><span id="${c.id}-v" class="big"></span></h2><canvas id="${c.id}-c"></canvas><div class="stats" id="${c.id}-x"></div></div>`)}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function draw(c,hist){
  const cv=document.getElementById(c.id+'-c'),r=devicePixelRatio||1;
  cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r;const x=cv.getContext('2d');x.scale(r,r);
  const W=cv.clientWidth,H=cv.clientHeight,L=40,B=16,w=W-L,h=H-B,vals=hist.map(s=>{try{return c.val(s)}catch(e){return null}});
  const nums=vals.filter(v=>v!=null);const max=c.max||Math.max(10,...nums)*1.15;
  const unit=c.fmt(1).replace(/^[\d.]+\s*/,'');
  x.font='10px sans-serif';x.fillStyle=css('--mut');x.textBaseline='middle';x.textAlign='right';
  for(let i=0;i<=4;i++){const y=h*i/4;x.strokeStyle=css('--grid');x.lineWidth=1;x.beginPath();x.moveTo(L,y);x.lineTo(W,y);x.stroke();
    x.fillText((max*(4-i)/4).toFixed(max<20?1:0),L-4,Math.min(Math.max(y,6),h-2))}
  x.textAlign='left';x.fillText(unit,2,h+8);
  const t1=hist.length?hist[hist.length-1].ts:0,t0=hist.length?hist[0].ts:0,span=t1-t0;
  const fmtT=t=>{const d=new Date(t*1000);return span>86400?d.toLocaleDateString([], {month:'short',day:'numeric'})+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:span<600?'2-digit':undefined})};
  x.textBaseline='alphabetic';
  if(span>0)for(let i=0;i<=3;i++){x.textAlign=i==0?'left':i==3?'right':'center';x.fillText(fmtT(t0+span*i/3),L+w*i/3,H-3)}
  if(!nums.length)return;
  const N=Math.max(hist.length,WIN&&WIN<=900?WIN:2),px=i=>L+w-(hist.length-1-i)*w/(N-1),py=v=>h-(v/max)*(h-2)-1;
  x.beginPath();let started=false;
  vals.forEach((v,i)=>{if(v==null)return;started?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v));started=true});
  x.strokeStyle=css(c.color);x.lineWidth=1.6;x.stroke();
  x.lineTo(L+w,h);x.lineTo(px(vals.findIndex(v=>v!=null)),h);x.globalAlpha=.12;x.fillStyle=css(c.color);x.fill();x.globalAlpha=1;
}
let WIN=60,SPAN=86400; // window length (s); history span (s)
const fmtDur=t=>t<3600?Math.round(t/60)+' min':t<86400?(t/3600).toFixed(t%3600?1:0)+' h':(t/86400).toFixed(t%86400?1:0)+' days';
const wFromPos=p=>p>=100?0:Math.round(60*Math.pow(Math.max(SPAN,120)/60,p/100)); // log scale 60s..SPAN, 0 = all
function wLabel(){const l=document.getElementById('w-lbl');l.textContent=WIN?fmtDur(WIN):'whole history ('+fmtDur(SPAN)+')'}
const wr=document.getElementById('w-range');
wLabel();
wr.oninput=()=>{WIN=wFromPos(+wr.value);wLabel();try{localStorage.w_pos=wr.value}catch(e){}tick()};
try{if(localStorage.w_pos!=null){wr.value=localStorage.w_pos;WIN=wFromPos(+wr.value)}}catch(e){}
function nest(r){return {ts:r.ts,cpu:{util_percent:r.cpu_percent,temp_c:r.cpu_temp_c},memory:{percent:r.ram_percent},
  gpu:{util_percent:r.gpu_percent,temp_c:r.gpu_temp_c},power:{total_w_est:r.power_total_w_est},
  disk:{active_percent:r.disk_active_percent},network:{recv_mbps:r.net_recv_mbps,sent_mbps:r.net_sent_mbps}}}
async function getHist(live){
  if(WIN&&WIN<=900)return live.history.slice(-WIN);
  const rows=await (await fetch(WIN?`/api/samples?hours=${WIN/3600}&points=600`:'/api/samples?hours=0&points=600')).json();
  return rows.map(nest);
}
async function tick(){
  try{
    const d=await (await fetch('/api/live?n=900')).json();
    const hist=await getHist(d);
    if(!d.latest){document.getElementById('sub').textContent='waiting for collector (agent/live_collector.ps1)...';return}
    const s=d.latest,age=(Date.now()/1000-s.ts);
    document.getElementById('host').textContent=s.hostname+' - live status';
    document.getElementById('sub').innerHTML=age<5?'live, updated every second':`<span class="warn">collector stalled (${age.toFixed(0)}s ago)</span>`;
    for(const c of CARDS){
      let v=null;try{v=c.val(s)}catch(e){}
      document.getElementById(c.id+'-v').textContent=v==null?'n/a':c.fmt(v);
      document.getElementById(c.id+'-x').innerHTML=c.extra(s);
      draw(c,hist);
    }
  }catch(e){document.getElementById('sub').innerHTML='<span class="warn">server unreachable</span>'}
}
tick();setInterval(tick,1000);
</script>
<script>
let wantHeadless=null;
async function brTick(){
  const led=(id,on)=>document.getElementById(id).className='led '+(on?'on':'off');
  try{
    const b=await (await fetch('/api/browser',{cache:'no-store'})).json();
    led('led-app',true); led('led-br',b.up);
    wantHeadless=b.wanted_headless;
    document.getElementById('br-info').textContent=b.up?`${b.endpoint} (${b.running_headless?'headless':'window'})`:'down';
    const t=document.getElementById('br-toggle'); t.disabled=false; t.textContent='Headless: '+(wantHeadless?'ON':'OFF')+' (click to switch)';
    document.getElementById('br-msg').textContent=b.up&&b.running_headless!==wantHeadless?'restarting...':'';
  }catch(e){led('led-app',false);led('led-br',false)}
}
document.getElementById('br-toggle').onclick=async()=>{
  await fetch('/api/settings',{method:'POST',body:JSON.stringify({browser_headless:!wantHeadless})});
  brTick();
};
brTick();setInterval(brTick,3000);
</script>
