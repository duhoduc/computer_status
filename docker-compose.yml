services:
  computer-status:
    build: ./app
    container_name: computer-status
    restart: always          # Docker restarts it on crash, and after Docker Desktop / PC reboot
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data          # status.db + access.log live in the repo's data/ folder (gitignored)
      - ./config:/config      # per-machine settings file lives here (untracked); the app creates it with defaults if missing
    environment:
      MACHINE: ${COMPUTERNAME:-}   # host name: selects app_<MACHINE>.py / live_<MACHINE>.html if present
      CONFIG_PATH: /config/general_computer_settings.json
      ACCESS_LOG_PATH: /data/access.log   # in data/, gitignored
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8765/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

